<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --surface: #0d1117;
            --surface2: #161b22;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --green: #00ff9d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: rgba(0, 212, 255, 0.15);
            --glow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: 3s; }
        .orb-3 { width: 200px; height: 200px; background: var(--green); top: 50%; left: 50%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.05); }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeDown 0.8s ease;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6));
        }

        .logo-name {
            font-family: 'Space Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--accent), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: fadeUp 0.8s ease 0.2s both;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .card-sub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        /* Flash messages */
        .flash {
            background: rgba(255, 75, 43, 0.1);
            border: 1px solid rgba(255, 75, 43, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ff6b6b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form */
        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 14px 14px 42px;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
            background: #0d1117;
        }

        input::placeholder { color: var(--muted); }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), #0090ff);
            border: none;
            border-radius: 12px;
            color: #050810;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4); }
        .btn-login:hover::before { opacity: 1; }
        .btn-login:active { transform: translateY(0); }

        /* Status indicator */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-wrapper">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="35" cy="35" r="32" stroke="url(#g1)" stroke-width="2"/>
                    <circle cx="35" cy="35" r="20" stroke="url(#g1)" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <circle cx="35" cy="35" r="6" fill="url(#g1)"/>
                    <line x1="35" y1="3" x2="35" y2="15" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="35" y1="55" x2="35" y2="67" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="3" y1="35" x2="15" y2="35" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="55" y1="35" x2="67" y2="35" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="35" cy="3" r="3" fill="#00ff9d"/>
                    <circle cx="35" cy="67" r="3" fill="#00ff9d"/>
                    <circle cx="3" cy="35" r="3" fill="#00ff9d"/>
                    <circle cx="67" cy="35" r="3" fill="#00ff9d"/>
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="70" y2="70" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00d4ff"/>
                            <stop offset="1" stop-color="#00ff9d"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="logo-name">NETPULSE</div>
            <div class="logo-sub">Network Monitor</div>
        </div>

        <div class="card">
            <div class="card-title">Connexion au système</div>
            <div class="card-sub">Entrez vos identifiants pour accéder au dashboard</div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="flash">⚠ {{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="field">
                    <label>Identifiant</label>
                    <div class="input-wrap">
                        <span class="input-icon">◈</span>
                        <input type="text" name="username" placeholder="admin" required autocomplete="off">
                    </div>
                </div>
                <div class="field">
                    <label>Mot de passe</label>
                    <div class="input-wrap">
                        <span class="input-icon">⬡</span>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">CONNEXION →</button>
            </form>

            <div class="status-bar">
                <div class="status-dot"></div>
                Système opérationnel — Serveur Linux actif
            </div>
        </div>
    </div>
</body>
</html>
