<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse — Smart Network Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --accent: #00d4ff;
            --green: #00ff9d;
            --accent2: #7c3aed;
            --text: #e6edf3;
            --muted: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            z-index: 0;
            animation: floatOrb 10s ease-in-out infinite;
        }

        .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: 4s; }
        .orb-3 { width: 250px; height: 250px; background: var(--green); top: 40%; left: 30%; animation-delay: 7s; opacity: 0.06; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .hero {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            margin: 0 auto 32px;
            width: 100px;
            height: 100px;
            position: relative;
        }

        .logo-wrap svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(0,212,255,0.5));
            animation: rotateSlow 20s linear infinite;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand {
            font-family: 'Space Mono', monospace;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--accent), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            line-height: 1;
        }

        .tagline {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .description {
            font-size: 16px;
            color: var(--muted);
            max-width: 480px;
            line-height: 1.7;
            margin: 0 auto 40px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent), #0090ff);
            border: none;
            border-radius: 50px;
            color: #050810;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,212,255,0.5);
        }

        .bottom-info {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            z-index: 10;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: blink 2s ease infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="hero">
        <div class="logo-wrap">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="47" stroke="url(#ig1)" stroke-width="2"/>
                <circle cx="50" cy="50" r="30" stroke="url(#ig1)" stroke-width="1.5" stroke-dasharray="5 4"/>
                <defs>
                    <linearGradient id="ig1" x1="0" y1="0" x2="100" y2="100">
                        <stop stop-color="#00d4ff"/>
                        <stop offset="1" stop-color="#00ff9d"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="brand">NETPULSE</div>
        <div class="tagline">Smart Network Monitor</div>
        
        <p class="description">
            Plateforme intelligente de surveillance et de gestion des équipements réseau.
        </p>

        <div class="cta-wrap">
            <!-- التصحيح هنا: الرابط يجب أن يوجه لـ /login لأن المستخدم لم يسجل دخوله بعد -->
            <a href="/login" class="btn-primary">
                ⬡ Accéder au Dashboard
            </a>
        </div>
    </div>

    <div class="bottom-info">
        <div class="live-dot"></div>
        SYSTÈME OPÉRATIONNEL — RENDER LINUX
    </div>

</body>
</html>
