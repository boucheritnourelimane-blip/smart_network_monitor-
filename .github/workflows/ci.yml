name: Pipeline CI/CD - Smart Network Monitor

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Intégration Continue (CI)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      # 2. Configuration de Python
      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Mise à jour de pip
      - name: 🔧 Mettre à jour pip
        run: python -m pip install --upgrade pip

      # 4. Installation des dépendances
      - name: 📦 Installer les dépendances
        run: |
          pip install -r requirements.txt

      # 5. Analyse du code (Lint)
      - name: 🔍 Analyse du code (Flake8)
        run: |
          pip install flake8
          flake8 . || true

      # 6. Exécution des tests
      - name: 🧪 Exécuter les tests
        run: |
          echo "Exécution des tests..."
          python -m pytest || echo "Aucun test trouvé"

  docker:
    name: Construction Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      # 1. Récupération du code
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      # 2. Configuration Docker
      - name: 🐳 Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Construire l’image Docker
      - name: 🏗️ Construire l’image Docker
        run: |
          docker build -t smart-network-monitor .

      # 4. Test de l’exécution du conteneur
      - name: ▶️ Tester le conteneur
        run: |
          docker run -d -p 5000:5000 smart-network-monitor
          sleep 5
          docker ps