name: Pipeline CI/CD - Smart Network Monitor

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer les linters
        run: pip install flake8 black
      - name: Flake8 PEP8
        run: flake8 . --max-line-length=120 --count --show-source --statistics || true
      - name: Black formatage
        run: black --check . || true

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer dependances
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Executer les tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70
      - name: Upload rapport couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-scan:
    name: Security Scan SAST
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer Bandit
        run: pip install bandit
      - name: Scanner vulnerabilites
        run: |
          bandit -r . -ll -f json -o bandit-report.json || true
          bandit -r . -ll || true
      - name: Upload rapport securite
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  dependency-scan:
    name: Dependency Scan SCA
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer Safety
        run: pip install safety
      - name: Scanner dependances
        run: safety check -r requirements.txt --full-report || true

  docker:
    name: Construction Docker
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construire image Docker
        run: docker build -t smart-network-monitor .
      - name: Tester le conteneur
        run: |
          docker run -d -p 5000:5000 smart-network-monitor
          sleep 5
          curl --fail http://localhost:5000 || exit 1
          docker ps

  deploy:
    name: Deploiement CD
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deployer sur Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"