name: Pipeline CI/CD - Smart Network Monitor

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Intégration Continue (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🔧 Mettre à jour pip
        run: python -m pip install --upgrade pip

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 🔍 Analyse du code (Flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 || true

      - name: 🧪 Exécuter les tests
        run: python -m pytest tests/ -v

  docker:
    name: Construction Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐳 Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construire l'image Docker
        run: docker build -t smart-network-monitor .

      - name: ▶️ Tester le conteneur
        run: |
          docker run -d -p 5000:5000 smart-network-monitor
          sleep 5
          docker ps

  deploy:
    name: Déploiement (CD)
    runs-on: ubuntu-latest
    needs: [ci, docker]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: 🚀 Déployer sur Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"